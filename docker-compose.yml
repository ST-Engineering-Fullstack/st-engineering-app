version: '3.8'

# Services
services:
  # Server service
  server:
    build:
      context: ../st-engineering-core
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "4000:4000"
    env_file: ../st-engineering-core/.env
    environment:
      - DB_HOST=mongodb_server
      - DB_USER=$MONGODB_USER
      - DB_PASSWORD=$MONGODB_PASSWORD
      - DB_NAME=$MONGODB_DATABASE
      - DB_PORT=$MONGODB_DOCKER_PORT
    depends_on:
      - mongodb

  # Client service
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - server

  # Database service
  mongodb:
    image: mongo:latest
    container_name: mongodb_server
    env_file: ../st-engineering-core/.env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

# Volumes define
volumes:
  mongodb_data: